[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oceansignatures"
version = "0.1.0"
description = "Reproducible underwater acoustic source, channel, receiver and active-echo laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "matplotlib>=3.9,<4", "soundfile>=0.12,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
